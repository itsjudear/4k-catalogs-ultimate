name: Update 4K catalogs

on:
  schedule:
    # 06:00 UTC daily. CheapCharts refreshes prices several times a day.
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # lets you trigger a refresh by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build catalog
        run: python build_catalog.py

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain docs/)" ]; then
            git add docs/
            git commit -m "Update catalog ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
